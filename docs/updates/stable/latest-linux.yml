releaseNotes: |-
  In Living Color: Sketch Wars v0.3.27, a free, unofficial fan-made fighting game.
  
  - Martin-style move list with your real keys; every special has a simple Modern input
  - The new soundtrack, the In Living Color song on the title card, Keenen's MESSAGE!, and intro, fight and win lines for every fighter
  - Lose a round and your next teammate steps in
  - Online Versus with a room code (Windows, Mac, Linux and the web version)
  - In-app updates
  - Fire Marshal Bill's new fire art; many combo and mode fixes
  
  Windows: run the Setup, or unzip the windows-x64 zip and open "In Living Color Sketch Wars.exe". The app is unsigned, so Windows may show "Windows protected your PC": choose More info, then Run anyway.
  Mac: unzip, then right-click the app and choose Open. If macOS says it is damaged, run: xattr -cr "/Applications/In Living Color Sketch Wars.app"
  Linux: make the AppImage executable and run it.
  
  Not affiliated with, endorsed by, or connected to In Living Color, its creators, network or cast.
